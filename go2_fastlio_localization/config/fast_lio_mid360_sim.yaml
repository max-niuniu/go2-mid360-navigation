/**:
  ros__parameters:
    feature_extract_enable: false
    point_filter_num: 2
    max_iteration: 3
    filter_size_surf: 0.25
    filter_size_map: 0.25
    cube_side_length: 100.0
    runtime_pos_log_enable: false
    # The launch file overrides this with <current_workspace>/maps/go2_workshop/map.pcd.
    map_file_path: "maps/go2_workshop/map.pcd"

    common:
      # The Gazebo plugin publishes this Livox CustomMsg alongside its raw
      # PointCloud2 topic.  It represents each Gazebo ray batch as one
      # timestamped snapshot, avoiding invalid yaw-derived point timing.
      lid_topic: "/livox/lidar_custom"
      imu_topic: "/imu/data"
      time_sync_en: false
      time_offset_lidar_to_imu: 0.0

    preprocess:
      lidar_type: 1
      scan_line: 4
      blind: 0.3
      timestamp_unit: 3
      # Kept in sync with the Gazebo plugin's update_rate.
      scan_rate: 5

    mapping:
      acc_cov: 0.1
      gyr_cov: 0.1
      b_acc_cov: 0.0001
      b_gyr_cov: 0.0001
      fov_degree: 360.0
      det_range: 15.0
      extrinsic_est_en: false
      # mapping.launch.py supplies extrinsic_T/R from
      # go2_mid360_description/config/mid360_mount.yaml (shared with robot Xacro).
      # Start through the project launch files; TF alone does not configure FAST-LIO.

    publish:
      path_en: true
      effect_map_en: false
      map_en: true
      scan_publish_en: true
      dense_publish_en: true
      scan_bodyframe_pub_en: true

    pcd_save:
      pcd_save_en: true
      interval: -1
